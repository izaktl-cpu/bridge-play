// ---------- the defence, asked ahead of time ----------
// A defender's card as a pure function of the position: the same cards played
// in the same order always get the same card back. That is what lets the page
// work the answer out before the position is reached and look it up when it is,
// and it is why the seed is the position rather than a running stream.
//
// Undo and "the same hand again" now give the same defence too, which they did
// not before.
function defencePositionKey(state, seat) {
  const parts = [];
  for (const trick of state.completedTricks) {
    for (const p of trick.plays) parts.push(p.seat + p.card.suit + p.card.rank);
  }
  for (const p of state.currentTrick.plays) parts.push(p.seat + p.card.suit + p.card.rank);
  return seat + "|" + parts.join(",");
}

function defencePositionSeed(key) {
  let h = 2166136261;
  for (let i = 0; i < key.length; i++) h = (Math.imul(h ^ key.charCodeAt(i), 16777619)) >>> 0;
  return h;
}

function positionalDefenceCard(state, seat) {
  return defenderCard(state, seat, mulberry32(defencePositionSeed(defencePositionKey(state, seat))), PLAY_DEFENCE_SAMPLES);
}


// ---------- the defence the student actually meets ----------
// Every other filter here judges a candidate against a SAMPLED defence, and a
// sample can be lucky. Measured across the banks built that way on 2026-08-29,
// between an eighth and a third of each one does not do what its exercise
// promises against a second defence.
//
// A defender's card is now seeded from the position rather than from a running
// stream, so the same position always gets the same card. That makes ONE
// play-through the answer instead of a sample of it, and it is the play-through
// the student will actually get.
function playOutStudentDefence(hands, style) {
  let s = createPlayState(hands, "W");
  s = playCard(s, "W", chooseOpeningLead(s.hands.W));
  let guard = 0;
  while (!isHandComplete(s)) {
    if (++guard > 60) throw new Error("infinite loop");
    const seat = s.turn;
    const card = (seat === "N" || seat === "S")
      ? scriptedDeclarerCard(s, seat, style)
      : positionalDefenceCard(s, seat);
    s = playCard(s, seat, card);
  }
  return tricksWon(s).declarerSide;
}

// The taught line has to make the contract with at most one overtrick, and
// every line the module has to defeat has to fail.
const STUDENT_DEFENCE_TRICKS_NEEDED = 10;
function studentDefenceHolds(hands) {
  const taught = playOutStudentDefence(hands, "draw");
  if (taught < STUDENT_DEFENCE_TRICKS_NEEDED) return false;
  if (taught > STUDENT_DEFENCE_TRICKS_NEEDED + 1) return false;
  if (playOutStudentDefence(hands, "cash") >= STUDENT_DEFENCE_TRICKS_NEEDED) return false;
  return true;
}

// ---------- app ----------
let seed = nextBankSeed();
let state = null;
let dealtHands = null;   // the deal as it was handed out, for the reveal at the end
let openingLeadCard = null;
let finished = false;
let systemRng = null;
let planningPhase = false;

// Puts the crow up, gives the browser one real frame to paint it, and only then
// runs the work. Without the double requestAnimationFrame the overlay is added
// to the DOM and the generator starts in the same frame, so nothing is ever
// drawn and the page just freezes - which is the whole problem this exists for.
// How long the last few deals took to generate, and the bar above which the crow
// is worth showing. There is no way to know in advance how long THIS deal will
// take - the generator is synchronous, and once it starts nothing can be painted
// - so the decision is made from the module's own recent history. In practice it
// settles per module: the heavy ones always show it, the quick ones never do.
const DEAL_TIMES = [];
const CROW_THRESHOLD_MS = 1200;
function recordDealTime(ms) {
  DEAL_TIMES.push(ms);
  if (DEAL_TIMES.length > 3) DEAL_TIMES.shift();
}
function dealIsSlow() {
  if (MODULE_BANK.length) return false;   // no waiting, so no waiting notice
  if (MODULE_BANK.length) return false;   // no waiting, so no waiting notice
  if (DEAL_TIMES.length === 0) return false;
  const sorted = DEAL_TIMES.slice().sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length / 2)] >= CROW_THRESHOLD_MS;
}

// ---------- the next deal, made while the student reads this one ----------
// Generating a deal costs seconds in the heavier modules, and the play ending is
// the one moment when that time is free: the hand is over, all four hands are on
// screen, and the student is looking at them. The result is kept until the next
// "יד חדשה", which then costs nothing.
let readyDeal = null; // { seed, hands, config }

// A generator sets the module's configuration as a side effect. Behind a
// finished hand that would be corruption - "replay the same deal" would rebuild
// it with the wrong suit - so the configuration is saved, the deal is made, and
// the configuration is put straight back.
function captureDealConfig() {
  return { TESTED_SUIT, SIDE_SUIT, SHORT_DEFENDER, strain: CONTRACT.strain };
}
function restoreDealConfig(saved) {
  TESTED_SUIT = saved.TESTED_SUIT;
  SIDE_SUIT = saved.SIDE_SUIT;
  SHORT_DEFENDER = saved.SHORT_DEFENDER;
  CONTRACT.strain = saved.strain;
}

// ---------- generation off the main thread ----------
// Making a deal now plays hands out against the solver-backed defence, and that
// costs seconds rather than milliseconds. On the main thread those seconds are a
// frozen screen. A Worker has its own thread, so the student never sees them.
//
// The worker is built out of this page's own source: everything above the app
// marker is exactly what a generator needs, and the solver comes in through
// importScripts. If anything in that chain is unavailable - no Worker, or a page
// opened straight off the disk where fetch is blocked - dealWorker stays false
// and generation simply happens on the main thread as it always did.
let dealWorker = null;
let dealWorkerBusy = false;

function startDealWorker() {
  if (dealWorker !== null || typeof Worker === "undefined") return;
  dealWorker = false; // tried already, so one failure does not retry every hand
  fetch(location.href)
    .then((r) => r.text())
    .then((html) => {
      const open = html.indexOf("<script>");
      const logic = html.slice(html.indexOf(">", open) + 1, html.indexOf("// ---------- app ----------"));
      const base = new URL(".", location.href).href;
      const src = "var Module = {};\n"
        + "importScripts(" + JSON.stringify(base + "engine/dds/libdds.js") + ", "
        + JSON.stringify(base + "engine/dds/browser.js") + ");\n"
        + logic
        + "\nself.onmessage = function (e) {\n"
        + "  try {\n"
        + "    if (e.data.kind === 'defend') {\n"
        + "      var c = e.data.config;\n"
        + "      TESTED_SUIT = c.TESTED_SUIT; SIDE_SUIT = c.SIDE_SUIT; SHORT_DEFENDER = c.SHORT_DEFENDER; CONTRACT.strain = c.strain;\n"
        + "      var card = positionalDefenceCard(e.data.state, e.data.seat);\n"
        + "      self.postMessage({ ok: true, kind: 'defend', key: e.data.key, card: card });\n"
        + "      return;\n"
        + "    }\n"
        + "    var hands = generateTrumpDrawDeal(e.data.seed);\n"
        + "    self.postMessage({ ok: true, seed: e.data.seed, hands: hands, config: { TESTED_SUIT, SIDE_SUIT, SHORT_DEFENDER, strain: CONTRACT.strain } });\n"
        + "  } catch (err) { self.postMessage({ ok: false, kind: e.data.kind, key: e.data.key, error: String(err) }); }\n"
        + "};\n";
      const worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      worker.onmessage = (e) => {
        const data = e.data || {};
        if (data.kind === "defend") {
          if (data.ok && data.card) defenceCache.set(data.key, data.card);
          defenceAsking = null;
          pumpDefenceQueue();
          return;
        }
        dealWorkerBusy = false;
        if (data.ok) readyDeal = { seed: data.seed, hands: data.hands, config: data.config };
      };
      worker.onerror = () => { dealWorker = false; dealWorkerBusy = false; defenceAsking = null; };
      dealWorker = worker;
      pumpDefenceQueue();
    })
    .catch(() => { dealWorker = false; });
}

// ---------- the defence, worked out before it is needed ----------
// Every answer the defence has already given, and the one being worked out now,
// keyed by the position it belongs to.
const defenceCache = new Map();
const defenceWanted = new Map();
const defenceQueue = [];
let defenceAsking = null;
const DEFENCE_CACHE_LIMIT = 400;

function pumpDefenceQueue() {
  if (defenceAsking !== null || !dealWorker || dealWorkerBusy) return;
  while (defenceQueue.length) {
    const key = defenceQueue.shift();
    const want = defenceWanted.get(key);
    defenceWanted.delete(key);
    if (!want || defenceCache.has(key)) continue;
    defenceAsking = key;
    dealWorker.postMessage({
      kind: "defend", key, seat: want.seat,
      state: { hands: want.state.hands, completedTricks: want.state.completedTricks, currentTrick: want.state.currentTrick, turn: want.state.turn },
      config: captureDealConfig(),
    });
    return;
  }
}

function askDefenceFor(st) {
  if (st.turn !== "E" && st.turn !== "W") return;
  const key = defencePositionKey(st, st.turn);
  if (defenceCache.has(key) || defenceWanted.has(key) || defenceAsking === key) return;
  defenceWanted.set(key, { state: st, seat: st.turn });
  defenceQueue.push(key);
}

// The position we are in, and every position one student card away from it.
function speculateDefence() {
  if (finished || !state) return;
  startDealWorker();
  askDefenceFor(state);
  if (state.turn === "N" || state.turn === "S") {
    // The taught card first. A student who follows the lesson plays it, and
    // the answer is then ready before he has finished putting it down.
    const legal = legalPlays(state, state.turn);
    let taught = null;
    try { taught = scriptedDeclarerCard(state, state.turn, "draw"); } catch (err) { taught = null; }
    const order = taught ? [taught, ...legal.filter((c) => cardKey(c) !== cardKey(taught))] : legal;
    for (const card of order) {
      let next;
      try { next = playCard(state, state.turn, card); } catch (err) { continue; }
      askDefenceFor(next);
    }
  }
  if (defenceCache.size > DEFENCE_CACHE_LIMIT) defenceCache.clear();
  pumpDefenceQueue();
}

function forgetDefence() {
  defenceCache.clear();
  defenceWanted.clear();
  defenceQueue.length = 0;
}

function prepareNextDeal() {
  if (MODULE_BANK.length) return;   // a bank deal is a lookup, nothing to prepare
  if (MODULE_BANK.length) return;   // a bank deal is a lookup, nothing to prepare
  if (readyDeal) return;
  startDealWorker();
  const nextSeed = nextBankSeed();
  if (dealWorker && !dealWorkerBusy) {
    dealWorkerBusy = true;
    dealWorker.postMessage({ seed: nextSeed });
    return;
  }
  if (dealWorkerBusy) return; // the worker is already making one
  const saved = captureDealConfig();
  try {
    const hands = generateTrumpDrawDeal(nextSeed);
    readyDeal = { seed: nextSeed, hands, config: captureDealConfig() };
  } catch (e) {
    readyDeal = null;
  } finally {
    restoreDealConfig(saved);
  }
}

// A short delay so the finished hand and its summary are on screen before the
// thread is taken. A plain timer and not requestAnimationFrame: rAF does not fire
// at all in a hidden or backgrounded tab, and this has to run there too - it is
// exactly the case where the student has switched away and come back expecting
// the next deal to be ready.
function scheduleNextDeal() {
  if (readyDeal) return;
  setTimeout(prepareNextDeal, 400);
}

function takeReadyDeal() {
  const d = readyDeal;
  readyDeal = null;
  return d;
}

function newDealWithNotice(work) {
  const el = document.getElementById("dealWait");
  // A deal made in advance costs nothing to hand over, so there is nothing to
  // wait for and no crow to send.
  if (!el || !dealIsSlow() || readyDeal) { work(); return; }
  el.classList.add("on");
  // The double frame is what lets the crow actually get painted before the
  // generator blocks the thread. The timer is not a belt-and-braces extra: in a
  // hidden or backgrounded tab requestAnimationFrame never fires at all, so
  // without it the click would put the overlay up and never deal the hand.
  // Whichever arrives first wins and the other becomes a no-op.
  let ran = false;
  const run = () => {
    if (ran) return;
    ran = true;
    try { work(); } finally { el.classList.remove("on"); }
  };
  requestAnimationFrame(() => requestAnimationFrame(run));
  setTimeout(run, 150);
}

function startDeal(useSeed) {
  if (pendingSystemTimeout !== null) { clearTimeout(pendingSystemTimeout); pendingSystemTimeout = null; }
  forgetDefence();
  stateHistory = [];
  seed = useSeed;
  // Timed so the crow knows whether this module is one of the slow ones.
  // A deal prepared at the end of the previous hand is used as it stands - it was
  // made by the same generator, for this seed, with this configuration.

  const __prepared = (readyDeal && readyDeal.seed === seed) ? takeReadyDeal() : null;
  let hands;
  if (__prepared) {
    hands = __prepared.hands;
    restoreDealConfig(__prepared.config);
  } else {
    const __genStart = (typeof performance !== "undefined" ? performance.now() : Date.now());
    hands = generateTrumpDrawDeal(seed);
    recordDealTime((typeof performance !== "undefined" ? performance.now() : Date.now()) - __genStart);
  }
  dealtHands = { N: hands.N.slice(), E: hands.E.slice(), S: hands.S.slice(), W: hands.W.slice() };
  state = createPlayState(hands, "W");
  finished = false;
  trickPausePending = false;
  systemRng = mulberry32(seed + 1);
  document.getElementById("resultBanner").innerHTML = "";
  openingLeadCard = chooseOpeningLead(state.hands.W);
  state = playCard(state, "W", openingLeadCard);
  renderBrief();
  suitRevealed = false;
  planningPhase = true;
  speculateDefence();
  render();
  renderSuitQuestion();
}

function renderBrief() {
  document.getElementById("briefPanel").innerHTML = `
    <div><b>החוזה:</b> <bdi>${CONTRACT.level}${SUIT_SYMBOL[CONTRACT.strain]}</bdi></div>
    <div><b>המכריז:</b> דרום</div>
    <div><b>הדומם:</b> צפון</div>
    <div><b>פגיעות:</b> ${VULNERABLE ? "פגיע" : "לא פגיע"}</div>
    <div><b>ההובלה:</b> <bdi>${cardLabel(openingLeadCard)}</bdi> (מערב)</div>
    <div style="opacity:0.6; font-size:12px;"><b>מספר יד:</b> <bdi>${boardLabel(seed)}</bdi></div>
  `;
}

function groupBySuit(cards) {
  const groups = { S: [], H: [], D: [], C: [] };
  for (const card of cards) groups[card.suit].push(card);
  for (const suit of SUITS) groups[suit].sort((a, b) => b.rank - a.rank);
  return groups;
}

function suitColorClass(suit) { return (suit === "H" || suit === "D") ? "red" : "black"; }

const HAND_LINE_SUIT_ORDER = ["S", "H", "C", "D"];

function renderHand(seat, elId) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  el.className = "hand-line";
  const legal = state.turn === seat && !finished && !trickPausePending && !planningPhase ? legalPlays(state, seat) : [];
  const legalKeys = new Set(legal.map(cardKey));
  const groups = groupBySuit(state.hands[seat]);
  for (const suit of HAND_LINE_SUIT_ORDER) {
    for (const card of groups[suit]) {
      const btn = document.createElement("button");
      btn.className = "rank-btn" + (suitColorClass(suit) === "red" ? " red" : "");
      btn.innerHTML = `<span class="card-rank">${RANK_LABEL[card.rank]}</span><span class="card-suit">${SUIT_SYMBOL[suit]}</span>`;
      const isLegal = legalKeys.has(cardKey(card));
      btn.disabled = !isLegal && !trickPausePending;
      if (isLegal) btn.addEventListener("click", () => onPlayerCard(seat, card));
      el.appendChild(btn);
    }
  }
}

// The four hands AS DEALT, drawn only once the play is over. state.hands is
// empty by then - every card has been played - so the full deal is kept aside in
// dealtHands at startDeal and read back here. The cards are plain, unclickable,
// and dimmed for the two hands the student could not see while playing.
function renderRevealedHand(seat, elId) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  el.className = "hand-line";
  const source = (dealtHands && dealtHands[seat]) || state.hands[seat];
  const groups = groupBySuit(source);
  for (const suit of HAND_LINE_SUIT_ORDER) {
    for (const card of groups[suit]) {
      const btn = document.createElement("button");
      btn.className = "rank-btn revealed" + (suitColorClass(suit) === "red" ? " red" : "");
      btn.innerHTML = `<span class="card-rank">${RANK_LABEL[card.rank]}</span><span class="card-suit">${SUIT_SYMBOL[suit]}</span>`;
      btn.disabled = true;
      el.appendChild(btn);
    }
  }
}

function renderHiddenHand(seat, elId) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  el.className = "hand-line";
  for (let i = 0; i < state.hands[seat].length; i++) {
    const back = document.createElement("div");
    back.className = "rank-back";
    el.appendChild(back);
  }
  // On a phone the backs are hidden and this line is shown instead - the only
  // thing those thirteen cards ever told the student was how many are left.
  const count = document.createElement("span");
  count.className = "hand-count";
  count.innerHTML = "<bdi>" + state.hands[seat].length + "</bdi> קלפים";
  el.appendChild(count);
}

const TRICK_POSITION_CLASS = { N: "trick-tn", E: "trick-te", S: "trick-ts", W: "trick-tw" };

function renderTrick(overridePlays) {
  const el = document.getElementById("trickArea");
  el.classList.toggle("awaiting-click", !!overridePlays);
  document.body.classList.toggle("awaiting-click", !!overridePlays);
  el.innerHTML = overridePlays ? `<div class="trick-tc">לחץ להמשך</div>` : "";
  const plays = overridePlays || state.currentTrick.plays;
  const played = new Set();
  for (const play of plays) {
    played.add(play.seat);
    const slot = document.createElement("div");
    slot.className = TRICK_POSITION_CLASS[play.seat];
    const colorClass = suitColorClass(play.card.suit);
    slot.innerHTML = `<div class="card-btn ${colorClass}">${cardLabel(play.card)}</div>`;
    el.appendChild(slot);
  }
  for (const seat of SEATS) {
    if (played.has(seat)) continue;
    const slot = document.createElement("div");
    slot.className = TRICK_POSITION_CLASS[seat];
    slot.innerHTML = `<div class="compass-letter">${seat}</div>`;
    el.appendChild(slot);
  }
}

function renderStatus() {
  const { declarerSide, defenseSide } = tricksWon(state);
  const turnText = finished ? "" : ` | תור: ${SEAT_NAME[state.turn]}`;
  document.getElementById("statusLine").innerHTML =
    `לקיחות - כרוז/דומם: <bdi>${declarerSide}</bdi> | הגנה: <bdi>${defenseSide}</bdi>${turnText}`;
}

function render(overrideTrickPlays) {
  if (finished) {
    renderRevealedHand("N", "handN");
    renderRevealedHand("S", "handS");
  } else {
    renderHand("N", "handN");
    renderHand("S", "handS");
  }
  if (finished) {
    renderRevealedHand("E", "handE");
    renderRevealedHand("W", "handW");
  } else {
    renderHiddenHand("E", "handE");
    renderHiddenHand("W", "handW");
  }
  renderTrick(overrideTrickPlays);
  renderStatus();
  // On a phone the table is unreadable once all four hands are face up, so the
  // stylesheet stacks them - it needs to know the hand is over.
  const table = document.querySelector(".table");
  if (table) table.classList.toggle("table--revealed", !!finished);
  if (finished) { renderResult(); renderPostHandFeedback(); scheduleNextDeal(); }
}

function renderResult() {
  const result = contractResult(state);
  const label = { made: "בוצע.", down: "ירד.", overtricks: "עודף." }[result];
  const cls = { made: "result-made", down: "result-down", overtricks: "result-over" }[result];
  const score = scoreResult(state);
  const scoreText = score.side === "declarer" ? `+${score.points} לכרוז/דומם` : `+${score.points} להגנה`;
  document.getElementById("resultBanner").innerHTML =
    `<div class="result-banner ${cls}">${label}<div style="font-size:16px; margin-top:4px;" dir="rtl">${scoreText}</div></div>`;
}

// Post-hand technique summary. Unlike the finesse modules there is no
// guess to grade (no split honors on our own side) - the whole technique is
// TIMING, so this scans completedTricks for the first trick N/S themselves
// led into TESTED_SUIT, and reports how early that was plus how many of the
// suit's tricks were actually won by N/S by the end of the hand.
function analyzeTrumpDrawOutcome(state) {
  let trumpRoundsLed = 0;
  let firstTrumpLeadIndex = -1;
  let ruffedTricks = 0;
  state.completedTricks.forEach((trick, idx) => {
    const ledSuit = trick.plays[0].card.suit;
    const ledByDeclarer = isDeclarerSide(trick.leader);
    if (ledSuit === TESTED_SUIT && ledByDeclarer) {
      trumpRoundsLed++;
      if (firstTrumpLeadIndex === -1) firstTrumpLeadIndex = idx;
    }
    // A trick the declarer side led in a side suit and a defender took with a
    // trump - the exact thing drawing trumps first prevents.
    const winner = trickWinner(trick);
    if (ledByDeclarer && ledSuit !== TESTED_SUIT && !isDeclarerSide(winner)) {
      const winningPlay = trick.plays.find((p) => p.seat === winner);
      if (winningPlay.card.suit === TESTED_SUIT) ruffedTricks++;
    }
  });
  return { trumpRoundsLed, firstTrumpLeadIndex, ruffedTricks };
}

const CONTRACT_MADE_PHRASES = ["החוזה בוצע.", "ביצעת את החוזה.", "החוזה הצליח."];
// Two different pools for a failed contract, not one - a student who used
// the right technique and still went down (bad split) needs a different
// message than one whose own late/missing lead caused the failure.
// Leads with the verdict on the PLAY, not with the failure, and says plainly that
// some hands cannot be made. Itzik the teacher, 2026-08-11: "אני רוצה שבכל מקום שתלמיד נפל
// ושיחק נכון שזה יהיה ליגיטימי... שהמסר אליו יהיה שיחקת נכון, בחלק מהמקרים אי
// אפשר לבצע את החוזה". The old wording apologised and blamed luck, which reads
// as if the student had still done something wrong.
const CONTRACT_FAILED_GOOD_TECHNIQUE_PHRASES = ["טכניקה נכונה. אבדה לך לקיחה במקום אחר."];
const CONTRACT_FAILED_BAD_TECHNIQUE_PHRASES = ["החוזה נפל. בפעם הבאה כדאי להוציא את השליטים לפני שגובים.", "החוזה נפל. ההסבר על משיכת השליטים נמצא בפאנל הצהוב, כדאי לקרוא אותו שוב.", "החוזה נפל. שווה לשחק את אותה יד שוב ולראות איפה היא נשברה."];

// ---------- progress ----------
// Ten made contracts finish an exercise. Kept in the browser's own storage,
// because the site is static: no login, no server, nothing leaves the machine.
const PROGRESS_STORE = "bdp-progress";
function recordProgress(made) {
  try {
    const all = JSON.parse(localStorage.getItem(PROGRESS_STORE) || "{}");
    const key = (location.pathname.split("/").pop() || "").toLowerCase();
    if (!key) return;
    const row = all[key] || { made: [], played: [] };
    const id = String(boardLabel(seed));
    if (!row.played.includes(id)) row.played.push(id);
    if (made && !row.made.includes(id)) row.made.push(id);
    all[key] = row;
    localStorage.setItem(PROGRESS_STORE, JSON.stringify(all));
  } catch (e) {
    // private browsing, or a file:// origin that refuses storage
  }
}

function renderPostHandFeedback() {
  const outcome = analyzeTrumpDrawOutcome(state);
  const suitLabel = SUIT_SYMBOL[TESTED_SUIT];
  const { declarerSide } = tricksWon(state);
  const tricksNeeded = 6 + CONTRACT.level;
  const madeContract = declarerSide >= tricksNeeded;
  recordProgress(madeContract);
  const playedCorrectly = outcome.firstTrumpLeadIndex !== -1 && outcome.ruffedTricks === 0;

  let technique;
  if (outcome.firstTrumpLeadIndex === -1) {
    technique = `לא משכת שליטים באף לקיחה. כל עוד ליריבים נשאר שליט, הקלפים הגבוהים שלך אינם בטוחים.`;
  } else if (outcome.ruffedTricks > 0) {
    technique = `לקיחה שלך נחתכה, כי ליריבים עוד נשארו שליטים. הסבב הראשון של <bdi>${suitLabel}</bdi> הגיע רק בלקיחה <bdi>${outcome.firstTrumpLeadIndex + 1}</bdi>.`;
  } else {
    technique = `הוצאת את השליטים לפני שגבית, וזאת הטכניקה הנכונה. לקח לך <bdi>${outcome.trumpRoundsLed}</bdi> סבבים של <bdi>${suitLabel}</bdi>.`;
  }
  let resultText;
  if (madeContract) {
    resultText = CONTRACT_MADE_PHRASES[Math.floor(Math.random() * CONTRACT_MADE_PHRASES.length)];
  } else if (playedCorrectly) {
    resultText = CONTRACT_FAILED_GOOD_TECHNIQUE_PHRASES[Math.floor(Math.random() * CONTRACT_FAILED_GOOD_TECHNIQUE_PHRASES.length)];
  } else {
    resultText = CONTRACT_FAILED_BAD_TECHNIQUE_PHRASES[Math.floor(Math.random() * CONTRACT_FAILED_BAD_TECHNIQUE_PHRASES.length)];
  }
  document.getElementById("studentPanelBody").innerHTML = `
    <div class="student-panel-summary">סיכום היד</div>
    <div>${technique}</div>
    <div style="margin-top:6px;">${resultText}</div>
  `;
}

// Varied feedback phrasing for the step-1 trick-count question - a fixed
// "נכון."/wrong-answer string every time read as robotic on repeat plays.
// Picked randomly so the same right (or wrong) answer doesn't always echo
// the same words.
const GIVE_TRICKS_CORRECT_PHRASES = ["נכון מאוד.", "יפה.", "צודק.", "מצוין."];
const GIVE_TRICKS_RETRY_PHRASES = ["נסה שנית.", "לא מדויק, ספור שוב.", "לא בדיוק, נסה שוב."];

// Pre-play planning dialogue, same 2-step pattern as finesse.html: (1) the
// student states how many tricks must be conceded to establish the suit
// (fixed at 2 for this module's structure), (2) a reminder to start early,
// THEN play unlocks. A wrong answer on the FIRST try only gets an
// encouragement-to-retry phrase (no reveal) so the student has a real second
// chance; the correct count is only revealed after a second wrong attempt.
// ---------- step 1: which suit ----------
// Deliberately before everything else. Reading a hand starts with finding the
// suit the contract turns on, and a panel that names it has already done the
// work. One wrong answer is told only to think again - naming the suit then
// would end the exercise - and a second gets the answer, because a student stuck
// at the first step cannot practise the rest.
const SUIT_QUESTION_ORDER = ["S", "H", "D", "C"];
const SUIT_CORRECT_PHRASES = ["נכון.", "בדיוק.", "יפה."];
let suitRevealed = false;

function suitQuestionAnswer() {
  return TESTED_SUIT;
}

// The wording is the brief's own goal line, which is written to explain exactly
// this. It stays in the brief as well, where it can be re-read during the play.
function suitQuestionReason() {
  return `<bdi>${SUIT_SYMBOL[TESTED_SUIT]}</bdi> היא סדרת השליט. מוציאים ממנה את השליטים של היריבים לפני שגובים את הקלפים הגבוהים, אחרת מגן שנגמרה לו סדרה יחתוך לקיחה שהייתה בטוחה.`;
}

function renderSuitQuestion() {
  const body = document.getElementById("studentPanelBody");
  const buttons = SUIT_QUESTION_ORDER.map((s) =>
    `<button type="button" class="action suit-choice" data-suit="${s}" style="padding:4px 12px; font-size:17px; margin:0;">${SUIT_SYMBOL[s]}</button>`
  ).join("");
  body.innerHTML = `
    <div class="student-panel-summary">שלב <bdi>1</bdi></div>
    <div>באיזו סדרה נתחיל?</div>
    <div style="margin-top:8px; display:flex; gap:6px;" dir="rtl">${buttons}</div>
    <div id="suitFeedback" style="margin-top:6px;"></div>
  `;
  let wrongAttempts = 0;
  const finish = (html) => {
    document.getElementById("suitFeedback").innerHTML =
      html + `<div style="margin-top:6px;"><button type="button" id="btnSuitContinue" class="action" style="padding:5px 10px; font-size:13px;">המשך</button></div>`;
    for (const b of body.querySelectorAll(".suit-choice")) b.disabled = true;
    suitRevealed = true;
    renderBrief();
    document.getElementById("btnSuitContinue").addEventListener("click", renderPlanningStep1);
  };
  for (const btn of body.querySelectorAll(".suit-choice")) {
    btn.addEventListener("click", () => {
      if (btn.dataset.suit === suitQuestionAnswer()) {
        finish(`${SUIT_CORRECT_PHRASES[Math.floor(Math.random() * SUIT_CORRECT_PHRASES.length)]}<div style="margin-top:6px;">${suitQuestionReason()}</div>`);
        return;
      }
      wrongAttempts++;
      if (wrongAttempts === 1) {
        document.getElementById("suitFeedback").innerHTML = "חשוב שנית.";
        return;
      }
      finish(`הסדרה היא <bdi>${SUIT_SYMBOL[suitQuestionAnswer()]}</bdi>.<div style="margin-top:6px;">${suitQuestionReason()}</div>`);
    });
  }
}

// The count itself is the technique. A student who never works out how many
// trumps are still out plays three rounds by rote and gets caught by the 4-1
// deals, so the number is asked BEFORE the first card is played. It is asked
// as a count of the defenders' trumps and not as a number of rounds
// (Itzik the teacher, 2026-08-18): the count is knowable from the two hands on the table,
// the number of rounds is not - it depends on a split the student cannot see.
function outstandingTrumps() {
  const ours = state.hands.N.filter((c) => c.suit === TESTED_SUIT).length
    + state.hands.S.filter((c) => c.suit === TESTED_SUIT).length
    + state.completedTricks.reduce((n, t) => n + t.plays.filter((p) => p.card.suit === TESTED_SUIT && isDeclarerSide(p.seat)).length, 0)
    + state.currentTrick.plays.filter((p) => p.card.suit === TESTED_SUIT && isDeclarerSide(p.seat)).length;
  return 13 - ours;
}

function renderPlanningStep1() {
  const body = document.getElementById("studentPanelBody");
  body.innerHTML = `
    <div class="student-panel-summary">שלב <bdi>2</bdi></div>
    <div>כמה שליטים יש ליריבים?</div>
    <div style="margin-top:8px; display:flex; gap:6px; align-items:center;" dir="rtl">
      <input type="number" id="giveTricksInput" min="0" max="13" style="width:56px; padding:4px; border-radius:5px; border:1px solid var(--panel-border); font-size:14px;" />
      <button type="button" id="btnGiveTricksSubmit" class="action" style="padding:5px 10px; font-size:13px;">בדוק</button>
    </div>
    <div id="giveTricksFeedback" style="margin-top:6px;"></div>
  `;
  const answer = outstandingTrumps();
  let wrongAttempts = 0;
  const finish = (html) => {
    document.getElementById("giveTricksFeedback").innerHTML =
      html + `<div style="margin-top:6px;"><button type="button" id="btnGiveTricksContinue" class="action" style="padding:5px 10px; font-size:13px;">המשך</button></div>`;
    document.getElementById("btnGiveTricksSubmit").disabled = true;
    document.getElementById("btnGiveTricksContinue").addEventListener("click", renderPlanningStep2);
  };
  document.getElementById("btnGiveTricksSubmit").addEventListener("click", () => {
    const val = parseInt(document.getElementById("giveTricksInput").value, 10);
    if (!Number.isFinite(val)) return;
    if (val === answer) {
      finish(GIVE_TRICKS_CORRECT_PHRASES[Math.floor(Math.random() * GIVE_TRICKS_CORRECT_PHRASES.length)]);
      return;
    }
    wrongAttempts++;
    if (wrongAttempts === 1) {
      document.getElementById("giveTricksFeedback").innerHTML =
        `ספור את השליטים שלך ושל הדומם, והחסר אותם מ-<bdi>13</bdi>.`;
      return;
    }
    finish(`ליריבים יש <bdi>${answer}</bdi> שליטים.`);
  });
}

function renderPlanningStep2() {
  const body = document.getElementById("studentPanelBody");
  body.innerHTML = `
    <div class="student-panel-summary">שלב <bdi>3</bdi></div>
    <div>הוצא קודם את כל השליטים של היריבים, ורק אחר כך גבה את הקלפים הגבוהים שלך. כל עוד נשאר להם שליט, לקיחה בטוחה שלך יכולה להיחתך. שים לב כמה שליטים נופלים בכל סבב, כי לפעמים צריך שלושה סבבים ולפעמים ארבעה.</div>
    <div style="margin-top:8px; text-align:center;">
      <button type="button" id="btnStartPlaying" class="action" style="padding:5px 10px; font-size:13px;">התחל לשחק, בהצלחה</button>
    </div>
  `;
  document.getElementById("btnStartPlaying").addEventListener("click", () => {
    planningPhase = false;
    render();
  });
}

let trickPausePending = false;
// One entry per card played, holding the state as it was BEFORE that card
// and the two flags that go with it. Undo is a pop.
let stateHistory = [];
let pendingSystemTimeout = null;

function playCardWithPause(seat, card) {
  stateHistory.push({ state, trickPausePending, finished });
  const willCompleteTrick = state.currentTrick.plays.length === 3;
  const completedPlays = willCompleteTrick ? [...state.currentTrick.plays, { seat, card }] : null;
  state = playCard(state, seat, card);
  if (willCompleteTrick) {
    trickPausePending = true;
    render(completedPlays);
    speculateDefence();
  } else {
    afterMove();
  }
}

function advancePastCompletedTrick() {
  if (!trickPausePending) return;
  trickPausePending = false;
  afterMove();
}

function onPlayerCard(seat, card) {
  if (finished || trickPausePending || planningPhase || state.turn !== seat) return;
  playCardWithPause(seat, card);
}

function afterMove() {
  if (isHandComplete(state)) {
    finished = true;
    render();
    return;
  }
  render();
  scheduleSystemPlayIfNeeded();
  speculateDefence();
}

function undoLastMove() {
  if (pendingSystemTimeout !== null) { clearTimeout(pendingSystemTimeout); pendingSystemTimeout = null; }
  // A defender's card goes through playCardWithPause as well, so ONE pop can
  // land on the defence's turn - and nothing there is scheduled to play it, so
  // the hand froze and the only way on was a new deal. What the student asked
  // to take back is his own card, and the defence's answer to it comes with it,
  // so keep popping until it is his turn again.
  let prev = stateHistory.pop();
  if (!prev) return;
  while ((prev.state.turn === "E" || prev.state.turn === "W") && stateHistory.length > 0) {
    prev = stateHistory.pop();
  }
  state = prev.state;
  trickPausePending = prev.trickPausePending;
  finished = prev.finished;
  render();
  // Only if the history ran out on a defender's turn - then the defence plays
  // on rather than leaving the student with nothing to click.
  if (state.turn === "E" || state.turn === "W") scheduleSystemPlayIfNeeded();
  // The cache was filled for the position the student left, not for the one he
  // came back to, so without this his next card waits about a second for an
  // answer that is normally ready before he asks.
  speculateDefence();
}

function scheduleSystemPlayIfNeeded() {
  if (finished || planningPhase) return;
  if (state.turn !== "E" && state.turn !== "W") return;
  const key = defencePositionKey(state, state.turn);
  pendingSystemTimeout = setTimeout(() => {
    pendingSystemTimeout = null;
    // Already worked out while the student was thinking, in almost every case.
    // If it is not - the student answered faster than the worker, or there is
    // no Worker at all - it is worked out here, exactly as it always was.
    const card = defenceCache.get(key) || positionalDefenceCard(state, state.turn);
    playCardWithPause(state.turn, card);
    speculateDefence();
  }, 450);
}

// ---------- manual layout controls (persisted, same mechanism as finesse.html) ----------
const LAYOUT_KEY = "trumpDrawHandLayoutV1";
const SEAT_EL_ID = { north: "seatNorth", south: "seatSouth", west: "seatWest", east: "seatEast" };

function defaultLayout() {
  return { north: { dx: 0, dy: 0, scale: 1 }, south: { dx: 0, dy: 0, scale: 1 }, west: { dx: 0, dy: 0, scale: 1 }, east: { dx: 0, dy: 0, scale: 1 } };
}

function loadLayout() {
  const defaults = defaultLayout();
  try {
    const raw = localStorage.getItem(LAYOUT_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      for (const key of Object.keys(defaults)) if (saved[key]) defaults[key] = saved[key];
    }
  } catch (e) { /* localStorage unavailable or corrupt - fall back to defaults */ }
  return defaults;
}

let handLayout = loadLayout();

function applyLayout(seatKey) {
  const el = document.getElementById(SEAT_EL_ID[seatKey]);
  const l = handLayout[seatKey];
  el.style.setProperty("--dx", l.dx + "px");
  el.style.setProperty("--dy", l.dy + "px");
  el.style.setProperty("--scale", String(l.scale));
}

for (const seatKey of ["north", "south", "west", "east"]) applyLayout(seatKey);

// ---------- "נתקעתי" report ----------
// The modules are self-contained HTML files opened straight off disk - there is
// no server to POST to, and an API key embedded here would be readable by every
// student who opens the file. mailto: is the only route that sends real mail
// without either. It hands the student's own mail client a fully composed
// message; they press send.
function stuckReportBody(note) {
  const lines = [];
  lines.push("תרגיל: " + document.title);
  lines.push("מספר יד: " + boardLabel(seed));
  lines.push("חוזה: " + CONTRACT.level + CONTRACT.strain + ", מכריז " + SEAT_NAME[CONTRACT.declarer]);
  lines.push("הובלה: " + (openingLeadCard ? cardLabel(openingLeadCard) : "-"));
  lines.push("");
  lines.push("הידיים:");
  // The deal AS DEALT; state.hands only holds what is left, and at the end of a
  // hand that is nothing at all - the report reached Itzik the teacher with four empty
  // hands. The page that this was written on calls it dealHandsSnapshot and
  // every other page calls it dealtHands, so both names are tried.
  const dealt = (typeof dealHandsSnapshot !== "undefined" && dealHandsSnapshot) ? dealHandsSnapshot
    : (typeof dealtHands !== "undefined" && dealtHands) ? dealtHands
    : (state ? state.hands : null);
  if (dealt) {
    for (const seat of ["N", "E", "S", "W"]) {
      const bySuit = SUITS.map((su) => {
        const cards = dealt[seat].filter((c) => c.suit === su)
          .sort((a, b) => b.rank - a.rank).map((c) => RANK_LABEL[c.rank] || c.rank).join("");
        return SUIT_SYMBOL[su] + (cards || "-");
      }).join("  ");
      lines.push("  " + SEAT_NAME[seat] + ": " + bySuit);
    }
  }
  if (state && state.completedTricks.length > 0) {
    lines.push("");
    lines.push("לקיחות ששוחקו (" + state.completedTricks.length + "):");
    state.completedTricks.forEach((trick, i) => {
      lines.push("  " + (i + 1) + ". " + trick.plays.map((p) => p.seat + cardLabel(p.card)).join(" ") +
        "  -> " + trickWinner(trick));
    });
  }
  if (note && note.trim()) {
    lines.push("");
    lines.push("מה לא היה ברור:");
    lines.push(note.trim());
  }
  return lines.join("\n");
}

// Two routes out, because neither works for everyone: mailto: needs a mail
// client configured on the machine, and the Gmail compose URL needs the student
// to be signed in to Gmail in this browser. The report text is on the clipboard
// either way, so a student with neither can still paste it anywhere.
const REPORT_TO = "bridgeil888@gmail.com";

function closeStuckModal() {
  const m = document.getElementById("stuckModal");
  if (m) m.remove();
}

function openStuckReport() {
  if (!state) { alert("התחל יד קודם"); return; }
  closeStuckModal();
  const overlay = document.createElement("div");
  overlay.id = "stuckModal";
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:9999;";
  overlay.innerHTML = `
    <div dir="rtl" style="background:var(--panel-bg,#f5f5f0); color:var(--text,#222); border-radius:10px; padding:16px; width:min(440px,92vw); box-shadow:0 10px 40px rgba(0,0,0,0.5);">
      <div style="font-weight:bold; font-size:16px; margin-bottom:4px;">נתקעת? שלח דיווח למורה</div>
      <div style="font-size:13px; opacity:0.8; margin-bottom:8px;">היד, מספר היד והלקיחות ששיחקת יישלחו אוטומטית. אפשר להוסיף מה לא היה ברור:</div>
      <textarea id="stuckNote" dir="auto" rows="3" style="width:100%; box-sizing:border-box; padding:6px; border-radius:6px; border:1px solid var(--panel-border,#bbb); font-size:14px;" placeholder="למשל: לא הבנתי למה לזרוק את האס"></textarea>
      <div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;">
        <button type="button" id="stuckGmail" class="action" style="flex:1; min-width:120px; padding:7px;">שלח דרך <bdi>Gmail</bdi></button>
        <button type="button" id="stuckMailto" class="action" style="flex:1; min-width:120px; padding:7px;">תוכנת המייל</button>
        <button type="button" id="stuckCancel" class="action" style="flex:0 0 auto; padding:7px 12px;">ביטול</button>
      </div>
      <div id="stuckHint" style="font-size:12px; opacity:0.75; margin-top:8px;"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeStuckModal(); });
  document.getElementById("stuckCancel").addEventListener("click", closeStuckModal);

  const subject = "נתקעתי - " + document.title;
  const compose = (route) => {
    const body = stuckReportBody(document.getElementById("stuckNote").value);
    if (navigator.clipboard) navigator.clipboard.writeText(body).catch(() => {});
    if (route === "gmail") {
      // Gmail's own compose window - no mail client needed, works wherever the
      // student is already signed in. Opened in a new tab so the hand stays put.
      window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(REPORT_TO) +
                  "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body), "_blank");
      document.getElementById("stuckHint").innerHTML = "נפתח חלון <bdi>Gmail</bdi>. אם הוא לא נפתח, הטקסט כבר הועתק - הדבק אותו במייל.";
      return;
    }
    // Windows drops mailto: URLs past roughly 2000 characters and a full hand
    // encodes past that, so the trick list is trimmed and the clipboard carries
    // the complete copy.
    const build = (t) => "mailto:" + REPORT_TO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(t);
    let text = body;
    if (build(text).length > 1900) {
      const cut = text.indexOf("לקיחות ששוחקו");
      if (cut > 0) {
        const noteAt = text.indexOf("מה לא היה ברור:");
        const tail = noteAt > cut ? text.slice(noteAt) : "";
        text = text.slice(0, cut) + "(רשימת הלקיחות הועתקה ללוח - הדבק אותה כאן)" + "\n\n" + tail;
      }
    }
    window.location.href = build(text);
    document.getElementById("stuckHint").innerHTML = "אם לא נפתחה תוכנת מייל, נסה את הכפתור של <bdi>Gmail</bdi> - הטקסט כבר הועתק.";
  };
  document.getElementById("stuckGmail").addEventListener("click", () => compose("gmail"));
  document.getElementById("stuckMailto").addEventListener("click", () => compose("mailto"));
}

      <span style="width:120px;flex:none;">${CAL_LABEL[k]}</span>
      <button data-k="${k}" data-d="-1" style="width:34px;height:34px;font-size:18px;">-</button>
      <span data-v="${k}" style="width:56px;text-align:center;flex:none;"></span>
      <button data-k="${k}" data-d="1" style="width:34px;height:34px;font-size:18px;">+</button>
    </div>`).join("")
    + '<pre id="calReadout" style="background:#000;padding:6px;white-space:pre-wrap;word-break:break-all;font-size:11px;direction:ltr;text-align:left;"></pre>'
    + '<button id="calReset" style="margin-top:4px;padding:6px 14px;">איפוס לברירת המחדל</button>';
  document.body.appendChild(calPanel);
  const calReadout = calPanel.querySelector("#calReadout");

  function calApply() {
    for (const k of Object.keys(calValues)) {
      document.documentElement.style.setProperty(k, calValues[k] + CAL_UNIT[k]);
      calPanel.querySelector(`span[data-v="${k}"]`).textContent = calValues[k] + CAL_UNIT[k];
    }
    localStorage.setItem(CAL_KEY, JSON.stringify(calValues));
    calReadout.textContent = JSON.stringify(calValues, null, 1);
  }

  calPanel.addEventListener("click", (e) => {
    const resetBtn = e.target.closest("#calReset");
    if (resetBtn) { calValues = { ...CAL_DEFAULTS }; calApply(); return; }
    const btn = e.target.closest("button[data-k]");
    if (!btn) return;
    const k = btn.dataset.k;
    calValues[k] = Math.round((calValues[k] + Number(btn.dataset.d) * CAL_STEP[k]) * 100) / 100;
    calApply();
  });

  calApply();
}
</script>
</body>
</html>
