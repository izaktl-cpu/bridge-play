<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>תרגול משחק היד - ההתקדמות שלי</title>
<style>
  :root {
    --bg: #1a5d37;
    --panel-bg: #f3ecfd;
    --gold: #c9a227;
    --accent: #2a5fa5;
    --text: #1a2a4a;
    --text-muted: #6b7280;
    --done: #15803d;
  }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { text-align: center; color: #ffffff; font-size: 22px; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #eafff0; font-size: 14px; margin-bottom: 8px; }
  .back-link { display: block; text-align: center; color: #eafff0; font-size: 13px; margin-bottom: 18px; text-decoration: underline; }
  .topic { margin-bottom: 18px; }
  .topic-name { color: #eafff0; font-size: 15px; font-weight: bold; margin: 0 0 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-bg);
    border: 3px solid var(--gold);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--text);
  }
  .row-title { flex: 1; font-size: 14px; font-weight: normal; color: var(--text); }
  .count { font-size: 14px; color: var(--text-muted); white-space: nowrap; }
  .row.done .count { color: var(--done); font-weight: bold; }
  .bar { height: 6px; border-radius: 3px; background: #ddd2ef; overflow: hidden; margin-top: 6px; }
  .bar span { display: block; height: 100%; background: var(--gold); }
  .row.done .bar span { background: var(--done); }
  .summary { text-align: center; color: #eafff0; font-size: 14px; margin: 0 0 18px; }
  .note { text-align: center; color: #cfe8d8; font-size: 12px; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ההתקדמות שלי</h1>
  <div class="subtitle">תרגיל נסגר אחרי <bdi>10</bdi> חוזים שביצעת</div>
  <a class="back-link" href="topics.html">&#8592; חזרה לנושאים</a>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <div class="note">ההתקדמות נשמרת בדפדפן הזה בלבד. במחשב אחר תתחיל מאפס.</div>
</div>
<script>
const TOPICS = [{"name":"עקיפה","exercises":[{"file":"finesse.html","title":"עקיפה על מלך"},{"file":"ace-sequence-finesse.html","title":"עקיפה מהדומם"},{"file":"queen-jack-ten-finesse.html","title":"עקיפה עם ביטוח"},{"file":"queen-ace-finesse.html","title":"עקיפה עם קלפים גבוהים מפוצלים"},{"file":"king-doubleton-finesse.html","title":"עקיפה לעומק"},{"file":"jack-finesse.html","title":"עקיפת הג'ק"},{"file":"double-finesse.html","title":"עקיפה כפולה"},{"file":"ruffing-finesse.html","title":"עקיפת חיתוך"}]},{"name":"פיתוח סדרה","exercises":[{"file":"suit-development-kqj.html","title":"מסירת קלף גבוה אחד להגנה"},{"file":"suit-development.html","title":"מסירת שני קלפים גבוהים להגנה"},{"file":"suit-development-kjt9.html","title":"מסירת קלף גבוה להגנה יחד עם עקיפה"}]},{"name":"הגבהת סדרה","exercises":[{"file":"suit-development-akq.html","title":"כשכל הקלפים הגבוהים אצלך"}]},{"name":"חסימה","exercises":[{"file":"unblock-cash-then-cross.html","title":"שחק את הגבוהים מהיד הקצרה ועבור ליד הארוכה עם קלף נמוך"},{"file":"unblock-discard-ace.html","title":"זריקת <bdi>A</bdi> על סדרה אחרת"},{"file":"unblock-discard-ak.html","title":"זריקת <bdi>A-K</bdi> על סדרה אחרת"},{"file":"unblock-discard-akq.html","title":"זריקת <bdi>A-K-Q</bdi> על סדרה אחרת"},{"file":"unblock-short-hand.html","title":"קלפים גבוהים מהיד הקצרה"},{"file":"unblock-missing-ace.html","title":"קלפים גבוהים מהיד הקצרה, כשחסר ה-<bdi>A</bdi>"},{"file":"unblock-overtake.html","title":"עלייה עם ה-<bdi>A</bdi> מעל הקלף של היד הקצרה"},{"file":"unblock-high-from-short.html","title":"היד המסוכנת, זריקת הקלפים הגבוהים מהיד הקצרה"},{"file":"unblock-two-way.html","title":"שתי סדרות חסומות, אחת בדומם ואחת ביד"}]},{"name":"עיכוב","exercises":[{"file":"holdup.html","title":"חוק ה-<bdi>7</bdi>"}]},{"name":"ויתור על לקיחה","exercises":[{"file":"duck-own-suit.html","title":"ויתור על הסיבוב הראשון"}]},{"name":"הימנעות מהיד המסוכנת","exercises":[{"file":"avoidance.html","title":"עקיפה דרך היד המסוכנת"}]},{"name":"משחק בשליט","exercises":[{"file":"loser-count.html","title":"ספירת מפסידים"},{"file":"loser-count-discard.html","title":"זריקת מפסידים על סדרה"},{"file":"trump-draw.html","title":"משיכת שליטים"},{"file":"trump-ruff-short.html","title":"חיתוך ביד הקצרה"}]}];
const TARGET = 10;
let store = {};
try { store = JSON.parse(localStorage.getItem("bdp-progress") || "{}"); } catch (e) { store = {}; }

let done = 0, total = 0;
const list = document.getElementById("list");
for (const topic of TOPICS) {
  const box = document.createElement("div");
  box.className = "topic";
  const name = document.createElement("div");
  name.className = "topic-name";
  name.textContent = topic.name;
  box.appendChild(name);
  for (const ex of topic.exercises) {
    total++;
    const made = ((store[ex.file.toLowerCase()] || {}).made || []).length;
    const isDone = made >= TARGET;
    if (isDone) done++;
    const a = document.createElement("a");
    a.className = "row" + (isDone ? " done" : "");
    a.href = ex.file;
    a.innerHTML =
      '<div style="flex:1;">' +
      '<div class="row-title"></div>' +
      '<div class="bar"><span style="width:' + Math.min(100, Math.round(made / TARGET * 100)) + '%"></span></div>' +
      "</div>" +
      '<div class="count"></div>';
    a.querySelector(".row-title").innerHTML = ex.title;
    a.querySelector(".count").innerHTML = isDone ? "הושלם" : "<bdi>" + made + "</bdi> מתוך <bdi>" + TARGET + "</bdi>";
    box.appendChild(a);
  }
  list.appendChild(box);
}
document.getElementById("summary").innerHTML = "השלמת <bdi>" + done + "</bdi> תרגילים מתוך <bdi>" + total + "</bdi>";
</script>
</body>
</html>
